<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mad Hatter Hat - Ever After High</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 10;
        }

        canvas {
            display: block;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        button.active {
            background: rgba(255, 100, 150, 0.7);
            border-color: #ff6496;
        }

        .music-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="file"] {
            padding: 8px 15px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 15px;
            cursor: pointer;
        }

        .info {
            color: white;
            text-align: center;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            max-width: 600px;
        }

        h1 {
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            font-size: 28px;
        }

        .beat-indicator {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .beat-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.1s ease;
        }

        .beat-dot.active {
            background: #ff1493;
            box-shadow: 0 0 20px #ff1493;
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎩 Mad Hatter's 3D Hat 🎩</h1>
        <canvas id="canvas"></canvas>
        <div class="beat-indicator">
            <div class="beat-dot"></div>
            <div class="beat-dot"></div>
            <div class="beat-dot"></div>
            <div class="beat-dot"></div>
        </div>
        <div class="controls">
            <button id="rotateBtn" class="active">🔄 Rotate</button>
            <button id="scaleBtn">📏 Scale</button>
            <button id="colorBtn">🎨 Color</button>
            <button id="resetBtn">🔄 Reset</button>
            <div class="music-input">
                <input type="file" id="musicFile" accept="audio/*">
                <button id="playBtn">🎵 Play</button>
            </div>
        </div>
        <div class="info">
            💡 Upload an MP3 or audio file, click Play, and watch the hat dance to the beat!<br>
            Use the buttons to rotate, scale, and change colors.
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
